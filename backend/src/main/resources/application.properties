# Server Configuration
server.port=8080
spring.application.name=smart-city-issue-reporting

# H2 Database Configuration (File-based - data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/smart_city_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# MySQL Database Configuration (Uncomment when MySQL is available)
#spring.datasource.url=jdbc:mysql://localhost:3306/smart_city_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Secret Key (Change this in production)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload Directory
file.upload-dir=./uploads

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.smartcity=DEBUG
logging.level.org.springframework.security=DEBUG
